name: refactor-harness

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, backend]

  frontend:
    build:
      context: ./frontend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - APP_DATABASE_URL=postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres-app:5432/${APP_DB_NAME}
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres-app: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  agent-worker:
    build:
      context: .
      dockerfile: agents/Dockerfile
    env_file: .env
    environment:
      - AGENT_DATABASE_URL=postgresql://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@postgres-agent:5432/${AGENT_DB_NAME}
      - SANDBOX_API_URL=http://sandbox-orchestrator:8080
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres-agent: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      sandbox-orchestrator: {condition: service_started}
      sandbox-image: {condition: service_completed_successfully}

  sandbox-orchestrator:
    build:
      context: ./sandbox/orchestrator
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - sandbox-egress

  sandbox-image:
    build:
      context: ./sandbox/image
    image: harness-sandbox:latest
    command: ["true"]
    restart: "no"

  postgres-app:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${APP_DB_USER}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_DB=${APP_DB_NAME}
    volumes: ["pgdata-app:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-agent:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${AGENT_DB_USER}
      - POSTGRES_PASSWORD=${AGENT_DB_PASSWORD}
      - POSTGRES_DB=${AGENT_DB_NAME}
    volumes: ["pgdata-agent:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_DB_USER} -d ${AGENT_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports: ["9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} &&
      mc mb -p local/langfuse &&
      exit 0"

  # ---- observability stack ----

  langfuse-web:
    image: langfuse/langfuse:3
    ports: ["3001:3000"]
    environment: &langfuse-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfuse-postgres: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      clickhouse: {condition: service_started}
      minio: {condition: service_healthy}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on:
      langfuse-postgres: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      clickhouse: {condition: service_started}
      minio: {condition: service_healthy}

  # Langfuse's BullMQ queues need a dedicated Redis; sharing the harness Redis
  # causes blocking-command socket timeouts and stalls trace ingestion.
  langfuse-redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD}
      - POSTGRES_DB=langfuse
    volumes: ["pgdata-langfuse:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    volumes: ["clickhousedata:/var/lib/clickhouse"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}

  prometheus:
    image: prom/prometheus:latest
    ports: ["${PROMETHEUS_PORT:-9092}:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports: ["3002:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana

networks:
  sandbox-egress:
    name: harness-sandbox-egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  pgdata-app: {}
  pgdata-agent: {}
  pgdata-langfuse: {}
  redisdata: {}
  miniodata: {}
  clickhousedata: {}
  prometheusdata: {}
  grafanadata: {}
