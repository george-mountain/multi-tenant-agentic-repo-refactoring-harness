events {}

http {
    # Docker's embedded DNS — re-resolve service IPs at runtime so nginx survives
    # container rebuilds (a static upstream caches a stale IP and returns 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        client_max_body_size 20m;

        location /api/ {
            set $backend_host backend;
            proxy_pass http://$backend_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            set $frontend_host frontend;
            proxy_pass http://$frontend_host:80;
            proxy_set_header Host $host;
        }
    }
}
